[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/archive",
    "crates/platform",
    "crates/journal",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/harlixay7/ReclaimArc"

[workspace.dependencies]
reclaimarc-core = { path = "crates/core" }
reclaimarc-archive = { path = "crates/archive" }
reclaimarc-platform = { path = "crates/platform" }
reclaimarc-journal = { path = "crates/journal" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
] }
proptest = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rawzip = { version = "0.5.1", default-features = false, features = ["std"] }
crc32fast = "1.4"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package.rusqlite]
opt-level = 2

[profile.dev.package.libsqlite3-sys]
opt-level = 2

[patch.crates-io]
unrar-ng-sys = { path = "vendor/unrar-ng-sys" }

