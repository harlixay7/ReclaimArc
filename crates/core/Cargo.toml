[package]
name = "reclaimarc-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reclaimarc-archive.workspace = true
reclaimarc-platform.workspace = true
reclaimarc-journal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
uuid.workspace = true
chrono.workspace = true

[features]
# Test-only observation hook: replaces the free-space probe with
# RECLAIMARC_TEST_FREE_SPACE. Enabled only in test builds. Never in
# production. See TESTING.md.
test-hooks = []

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
rusqlite.workspace = true
reclaimarc-core = { path = ".", features = ["test-hooks"] }
reclaimarc-archive = { workspace = true }
