name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Desktop Frontend Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Desktop Frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Run Workspace Tests
        run: cargo test --workspace --all-features

      - name: Build Desktop Application & Installer (Tauri)
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Prepare Release Assets & Checksums
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          
          # NSIS Setup Installer
          Get-ChildItem -Path "target/release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist-release/ReclaimArc-Setup-x64.exe"
          }
          
          # Generate SHA-256 Checksums
          Get-ChildItem -Path "dist-release" -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "dist-release/SHA256SUMS.txt" -Append -Encoding ascii
          }
          
          Get-ChildItem -Path dist-release

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/ReclaimArc-Setup-x64.exe
            dist-release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
