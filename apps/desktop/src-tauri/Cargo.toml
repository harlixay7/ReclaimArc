[package]
name = "reclaimarc-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "reclaimarc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enabled by the Tauri CLI for production builds (`tauri build`): embeds the
# frontend dist instead of loading devUrl. Building without it produces an
# exe that expects the vite dev server on localhost:1420.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde.workspace = true
serde_json.workspace = true
reclaimarc-core.workspace = true
reclaimarc-archive.workspace = true
reclaimarc-journal.workspace = true
reclaimarc-platform.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

